name: 提一道题
description: 数学、科学或工程里还没解决的问题，进展是一个由程序检查的数
title: "[提题] "
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        什么样的题合适，见 CONTRIBUTING.md 的「提一道题」。几点提醒：

        - Issue 是公开的。不要贴未公开的数据、个人信息或任何凭据。
        - 只收证书型题：参与者提交的是数据（JSON / CSV / TXT / MD），验证器只解析和计算，不运行参与者的代码。
        - 题目如被采用，会对所有人同时公开，提题人也不会提前拿到题面、验证器或基线。

  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 用一两段话说清楚要做成什么。尽量给出精确定义和公开出处。
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 为什么重要
      description: 这个问题从哪里来？再进一步意味着什么？谁会在意？
    validations:
      required: true

  - type: textarea
    id: metric
    attributes:
      label: 进度指标与方向
      description: 指标是什么、单位是什么、越大越好还是越小越好；参与者提交的证书是什么数据。
      placeholder: |
        指标：
        单位：
        方向：越大越好 / 越小越好
        证书：
    validations:
      required: true

  - type: textarea
    id: verifier
    attributes:
      label: 验证器思路
      description: 验证器拿到证书后，怎样只靠解析和计算判断它合格并算出分数？大致需要多少计算量？不能依赖运行参与者的代码。
    validations:
      required: true

  - type: textarea
    id: baseline
    attributes:
      label: 预设基线
      description: 目前公开已知的最好结果，以及出处（论文、数据集、网页链接）。
    validations:
      required: true

  - type: textarea
    id: headroom
    attributes:
      label: 为什么还有余量
      description: 为什么认为目前最好的结果还能改进？已知的上界或下界、理论极限，以及你建议的目标值。
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: 数据与许可
      description: 题目和验证器需要的数据、资料从哪里来，许可是什么。题目不应涉及个人信息。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 参与者只需提交数据（证书），验证器不需要运行参与者的代码。
          required: true
        - label: 我有权公开以上内容，所列数据的许可允许公开使用。
          required: true
        - label: 我理解题目如被采用，会对所有人同时公开，提题人也不会提前拿到题面、验证器或基线。
          required: true
